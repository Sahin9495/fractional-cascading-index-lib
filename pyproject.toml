[project]
name = "fractional-cascading-index-lib"
version = "0.1.1"
description = "Python library for searching a key across multiple sorted arrays in one logarithmic pass via fractional cascading"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
